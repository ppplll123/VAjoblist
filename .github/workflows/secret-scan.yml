name: Secret Scan (gitleaks + trufflehog)

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 7 * * 1'  # Mondays 07:00 UTC (weekly — preserves private-repo Action minutes)
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git-history scan

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .github/gitleaks.toml

  trufflehog:
    name: trufflehog (verified secrets only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog (only-verified)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified --fail
